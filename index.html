<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SmartInvest">
<meta name="theme-color" content="#050816">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>SmartInvest</title>
<style>
  html,body{margin:0;height:100%;background:#050816;color:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Heebo,Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden}
  body::before{content:'';position:fixed;inset:-20vmax;z-index:-1;background:radial-gradient(38vmax 34vmax at 20% 25%,rgba(79,70,229,.55),transparent 62%),radial-gradient(34vmax 30vmax at 80% 20%,rgba(168,85,247,.38),transparent 60%),radial-gradient(40vmax 36vmax at 70% 85%,rgba(14,165,233,.35),transparent 62%),linear-gradient(160deg,#070a1f,#0a0f2e 45%,#060a1a)}
  .card{width:min(88vw,340px);padding:28px 24px;text-align:center;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.02) 40%),rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-top-color:rgba(255,255,255,.24);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:0 20px 40px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.2)}
  h1{margin:0 0 6px;font-size:20px;font-weight:600;letter-spacing:-.02em}
  p{margin:0;color:rgba(226,232,240,.65);font-size:14px}
  .spin{width:28px;height:28px;margin:18px auto 0;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#A5B4FC;animation:s 1s linear infinite}
  a{color:#C7D2FE}
  .btn{display:block;width:100%;margin-top:14px;padding:12px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.22);font-size:15px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(180deg,#8587FF,#6366F1 48%,#4F46E5);box-shadow:0 8px 22px rgba(79,70,229,.42),inset 0 1px 0 rgba(255,255,255,.42)}
  .btn.ghost{background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);font-weight:500}
  .hidden{display:none}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <h1>SmartInvest</h1>
  <p id="msg">מתחבר לשרת המאובטח…</p>
  <div class="spin" id="spin"></div>
  <div id="notif" class="hidden">
    <button class="btn" id="enableBtn" type="button">הפעל התראות במכשיר זה</button>
    <button class="btn ghost" id="skipBtn" type="button">לא עכשיו</button>
  </div>
</div>
<script>
(function () {
  var msg = document.getElementById('msg'), spin = document.getElementById('spin'), notif = document.getElementById('notif');
  var isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
  var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  function b64uToBytes(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); var b = atob(s + '='.repeat((4 - s.length % 4) % 4)); var a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  async function serverUrl() {
    var r = await fetch('url.json?t=' + Date.now(), { cache: 'no-store' });
    var d = await r.json();
    if (!d || !/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(d.url)) throw new Error('bad url');
    return d.url;
  }
  function safeGo() {
    var go = new URLSearchParams(location.search).get('go') || '/';
    return /^\/[A-Za-z0-9\/?=&._#-]*$/.test(go) ? go : '/';
  }
  async function redirect(extraHash) {
    try {
      var url = await serverUrl();
      location.replace(url + safeGo() + (extraHash || ''));
    } catch (e) {
      spin.style.display = 'none';
      msg.innerHTML = 'השרת לא זמין כרגע. ייתכן שהמחשב כבוי או מתחבר מחדש.<br><a href="">נסה שוב</a>';
    }
  }
  function showNotifSetup() {
    spin.style.display = 'none';
    if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) {
      msg.innerHTML = isIOS && !isStandalone
        ? 'באייפון ההתראות עובדות רק מהאפליקציה במסך הבית: לחץ על כפתור השיתוף ← "הוסף למסך הבית", ופתח משם.'
        : 'הדפדפן הזה לא תומך בהתראות.';
      notif.classList.remove('hidden'); document.getElementById('enableBtn').classList.add('hidden');
      document.getElementById('skipBtn').textContent = 'המשך לדשבורד';
      return;
    }
    msg.textContent = 'קבל התראה על תנודה חריגה, על תדריך יום שישי ועל הדוח החודשי.';
    notif.classList.remove('hidden');
  }
  document.getElementById('skipBtn').onclick = function () { try { localStorage.setItem('si_notif_dismissed', '1'); } catch (e) {} notif.classList.add('hidden'); spin.style.display = ''; msg.textContent = 'מתחבר לשרת המאובטח…'; redirect(); };
  document.getElementById('enableBtn').onclick = async function () {
    var btn = this; btn.disabled = true; btn.textContent = 'מפעיל…';
    try {
      var perm = await Notification.requestPermission();
      if (perm !== 'granted') throw new Error('ההרשאה לא אושרה. אפשר להפעיל אותה בהגדרות המכשיר.');
      var reg = await navigator.serviceWorker.ready;
      var url = await serverUrl();
      var keyRes = await fetch(url + '/api/push/vapid-public-key', { cache: 'no-store' });
      var key = (await keyRes.json()).publicKey;
      var sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(key) });
      try { localStorage.setItem('si_notif_dismissed', '1'); } catch (e) {}
      var payload = btoa(unescape(encodeURIComponent(JSON.stringify({ subscription: sub.toJSON(), device: (isIOS ? 'iPhone' : navigator.platform || 'מכשיר') + (isStandalone ? ' (אפליקציה)' : '') }))));
      location.replace(url + '/#push=' + encodeURIComponent(payload));
    } catch (e) {
      btn.disabled = false; btn.textContent = 'נסה שוב';
      msg.textContent = e.message || 'ההפעלה נכשלה';
    }
  };

  var wantsSetup = location.hash === '#notifications';
  var askOnce = false;
  try { askOnce = isStandalone && 'Notification' in window && Notification.permission === 'default' && !localStorage.getItem('si_notif_dismissed'); } catch (e) {}
  if (wantsSetup || askOnce) showNotifSetup(); else redirect();
})();
</script>
</body>
</html>
