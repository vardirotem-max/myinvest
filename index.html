<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SmartInvest">
<meta name="theme-color" content="#050816">
<title>SmartInvest</title>
<style>
  html,body{margin:0;height:100%;background:#050816;color:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Heebo,Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden}
  body::before{content:'';position:fixed;inset:-20vmax;z-index:-1;background:radial-gradient(38vmax 34vmax at 20% 25%,rgba(79,70,229,.55),transparent 62%),radial-gradient(34vmax 30vmax at 80% 20%,rgba(168,85,247,.38),transparent 60%),radial-gradient(40vmax 36vmax at 70% 85%,rgba(14,165,233,.35),transparent 62%),linear-gradient(160deg,#070a1f,#0a0f2e 45%,#060a1a)}
  .card{width:min(88vw,340px);padding:28px 24px;text-align:center;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.02) 40%),rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-top-color:rgba(255,255,255,.24);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:0 20px 40px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.2)}
  h1{margin:0 0 6px;font-size:20px;font-weight:600;letter-spacing:-.02em}
  p{margin:0;color:rgba(226,232,240,.65);font-size:14px}
  .spin{width:28px;height:28px;margin:18px auto 0;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#A5B4FC;animation:s 1s linear infinite}
  a{color:#C7D2FE}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <h1>SmartInvest</h1>
  <p id="msg">מתחבר לשרת המאובטח…</p>
  <div class="spin" id="spin"></div>
</div>
<script>
(async function () {
  var msg = document.getElementById('msg');
  try {
    var r = await fetch('url.json?t=' + Date.now(), { cache: 'no-store' });
    var d = await r.json();
    if (!d || !/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(d.url)) throw new Error('bad url');
    location.replace(d.url + location.search + location.hash);
  } catch (e) {
    document.getElementById('spin').style.display = 'none';
    msg.innerHTML = 'השרת לא זמין כרגע. ייתכן שהמחשב כבוי או מתחבר מחדש.<br><a href="">נסה שוב</a>';
  }
})();
</script>
</body>
</html>
