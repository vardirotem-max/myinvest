<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyInvest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="MyInvest">
<meta name="theme-color" content="#DCE8FF">
<meta name="description" content="MyInvest - תיק ההשקעות האישי שלך">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon.ico">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/splash-750x1334.png">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1170x2532.png">
<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1179x2556.png">
<link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1290x2796.png">
<link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1206x2622.png">
<link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1320x2868.png">
<title>MyInvest</title>
<style>
  html,body{margin:0;height:100%;background:#CFE0FF;color:#0B1530;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Heebo,Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden}
  body::before{content:'';position:fixed;inset:-10vmax;z-index:-1;background:radial-gradient(60vmax 40vmax at 88% 6%,rgba(255,255,255,.95),transparent 60%),radial-gradient(50vmax 42vmax at 8% 96%,rgba(20,86,230,.85),transparent 62%),radial-gradient(46vmax 36vmax at 30% 40%,rgba(96,156,255,.55),transparent 64%),linear-gradient(160deg,#EAF2FF 0%,#BCD4FF 38%,#6E9EF5 70%,#3E73E6 100%)}
  .card{width:min(88vw,340px);padding:30px 24px;text-align:center;border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,.25) 50%),rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.6);border-top-color:rgba(255,255,255,.9);backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);box-shadow:0 10px 30px rgba(28,64,160,.16),inset 0 1px 0 #fff}
  .logo{width:64px;height:64px;border-radius:22.4%;box-shadow:0 12px 28px rgba(20,60,180,.32);margin-bottom:14px}
  .wm{font-weight:650;letter-spacing:-.035em;font-size:26px;direction:ltr}.wm b{color:#0A6CFF;font-weight:650}
  h1{margin:0 0 6px;font-size:20px;font-weight:600;letter-spacing:-.02em}
  p{margin:0;color:#46536B;font-size:14px}
  .spin{width:28px;height:28px;margin:18px auto 0;border-radius:50%;border:3px solid rgba(10,108,255,.15);border-top-color:#0A6CFF;animation:s 1s linear infinite}
  a{color:#0A6CFF}
  .btn{display:block;width:100%;margin-top:14px;padding:12px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.55);font-size:15px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(180deg,#5AA2FF,#0A6CFF 55%,#0058E6);box-shadow:0 8px 22px rgba(10,108,255,.32),inset 0 1px 0 rgba(255,255,255,.55)}
  .btn.ghost{background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.45));color:#22304D;border-color:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(28,64,160,.1),inset 0 1px 0 #fff;font-weight:500}
  .hidden{display:none}
  @keyframes s{to{transform:rotate(360deg)}}
  .steps{text-align:right;margin:16px 0 8px;padding:0 20px 0 0;font-size:14px;line-height:1.9;color:#22304D}
  .steps .ico{display:inline-block;padding:0 6px;border-radius:6px;background:rgba(10,108,255,.12);color:#0A6CFF;font-weight:700}
  .note{font-size:12px!important;margin-top:6px!important;color:#6B7690!important}
  /* App shell: dashboard full-screen inside the home-screen app (no browser bar) */
  #appFrame{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);width:100%;height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));border:0;background:transparent;opacity:0;transition:opacity .25s}
  #appFrame.ready{opacity:1}
  html.embedded body::before{background:linear-gradient(180deg,#E9F1FF,#DCE8FF)}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="icon-192.png" alt="" width="64" height="64">
  <h1 class="wm"><b>My</b>Invest</h1>
  <p id="msg">מתחבר לשרת המאובטח…</p>
  <div class="spin" id="spin"></div>
  <div id="install" class="hidden">
    <ol class="steps">
      <li>לחץ על כפתור השיתוף <span class="ico">⬆︎</span> בתחתית ספארי</li>
      <li>בחר <b>"הוסף למסך הבית"</b> ואשר</li>
      <li>פתח את <b>MyInvest</b> מהאייקון החדש והפעל התראות</li>
    </ol>
    <p class="note">אם יש לך אייקון ישן של MyInvest או SmartInvest, מחק אותו קודם. הוא נשמר מכתובת זמנית ולא יעבוד.</p>
    <button class="btn ghost" id="continueBtn" type="button">המשך לדשבורד בספארי</button>
  </div>
  <div id="notif" class="hidden">
    <button class="btn" id="enableBtn" type="button">הפעל התראות במכשיר זה</button>
    <button class="btn ghost" id="skipBtn" type="button">לא עכשיו</button>
  </div>
</div>
<script>
(function () {
  var msg = document.getElementById('msg'), spin = document.getElementById('spin'), notif = document.getElementById('notif'), install = document.getElementById('install');
  var isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var params = new URLSearchParams(location.search);
  var swReady = ('serviceWorker' in navigator) ? navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; }) : Promise.reject(new Error('no sw'));
  swReady.catch(function () {});
  var ls = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

  function b64uToBytes(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); var b = atob(s + '='.repeat((4 - s.length % 4) % 4)); var a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  async function serverUrl() {
    var r = await fetch('url.json?t=' + Date.now(), { cache: 'no-store' });
    var d = await r.json();
    if (!d || !/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(d.url)) throw new Error('bad url');
    return d.url;
  }
  function safeGo() {
    var go = params.get('go') || '/';
    if (!/^\/[A-Za-z0-9\/?=&._#-]*$/.test(go)) go = '/';
    var k = go.indexOf('#');
    return { path: k >= 0 ? go.slice(0, k) : go, hash: k >= 0 ? go.slice(k + 1) : '' };
  }
  function devName() { return (isIOS ? 'iPhone' : (navigator.platform || 'מכשיר')) + (isStandalone ? ' (אפליקציה)' : ''); }
  // Current subscription, encoded for the dashboard (re-sent on every launch so it can never get lost)
  async function pushPayload(allowSubscribe, url) {
    if (!('Notification' in window) || Notification.permission !== 'granted' || !('PushManager' in window)) return '';
    var reg = await Promise.race([swReady, new Promise(function (_, rej) { setTimeout(function () { rej(new Error('sw timeout')); }, 8000); })]);
    var sub = await reg.pushManager.getSubscription();
    if (!sub && allowSubscribe) {
      var keyRes = await fetch(url + '/api/push/vapid-public-key', { cache: 'no-store' });
      var key = (await keyRes.json()).publicKey;
      if (!key) throw new Error('השרת לא מוכן להתראות');
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(key) });
    }
    if (!sub) return '';
    return btoa(unescape(encodeURIComponent(JSON.stringify({ subscription: sub.toJSON(), device: devName() }))));
  }
  async function redirect(payload) {
    try {
      var url = await serverUrl();
      if (payload === undefined) { try { payload = await pushPayload(true, url); } catch (e) { payload = ''; } }
      var go = safeGo();
      var hash = [go.hash, isStandalone ? 'via=link' : '', payload ? 'push=' + encodeURIComponent(payload) : ''].filter(Boolean);
      var target = url + go.path + (hash.length ? '#' + hash.join('&') : '');
      // Inside the home-screen app: keep the dashboard in a full-screen frame so iOS does not add a browser bar
      if (isStandalone) embed(target, url); else location.replace(target);
    } catch (e) {
      spin.style.display = 'none';
      msg.innerHTML = 'השרת לא זמין כרגע. ייתכן שהמחשב כבוי או מתחבר מחדש.<br><a href="">נסה שוב</a>';
    }
  }
  var frame = null, currentServer = null;
  function embed(target, server) {
    currentServer = server;
    document.documentElement.classList.add('embedded');
    if (!frame) {
      frame = document.createElement('iframe');
      frame.id = 'appFrame';
      frame.title = 'MyInvest';
      frame.setAttribute('allow', 'publickey-credentials-get *; publickey-credentials-create *; microphone *; clipboard-write *; autoplay *');
      frame.onload = function () { frame.classList.add('ready'); document.querySelector('.card').style.visibility = 'hidden'; };
      document.body.appendChild(frame);
    }
    frame.src = target;
  }
  // The tunnel address changes when the PC restarts: follow it without the user reopening the app
  async function followServer() {
    if (!frame || document.hidden) return;
    try { var u = await serverUrl(); if (u !== currentServer) { frame.classList.remove('ready'); document.querySelector('.card').style.visibility = ''; embed(u + '/#via=link', u); } } catch (e) {}
  }
  setInterval(followServer, 60000);
  document.addEventListener('visibilitychange', followServer);

  function showInstall() {
    spin.style.display = 'none';
    msg.innerHTML = '<b>שמור את MyInvest למסך הבית מהעמוד הזה</b><br>כך האייקון יעבוד תמיד, וההתראות יפעלו.';
    install.classList.remove('hidden');
  }
  function showNotifSetup() {
    spin.style.display = 'none';
    if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) {
      if (isIOS && !isStandalone) { showInstall(); return; }
      msg.textContent = 'הדפדפן הזה לא תומך בהתראות.';
      notif.classList.remove('hidden'); document.getElementById('enableBtn').classList.add('hidden');
      document.getElementById('skipBtn').textContent = 'המשך לדשבורד';
      return;
    }
    if (Notification.permission === 'denied') {
      msg.innerHTML = 'ההתראות חסומות במכשיר הזה.<br>פתח <b>הגדרות ← התראות ← MyInvest</b> והפעל "אפשר התראות", ואז פתח שוב את האפליקציה.';
      notif.classList.remove('hidden'); document.getElementById('enableBtn').classList.add('hidden');
      document.getElementById('skipBtn').textContent = 'המשך לדשבורד';
      return;
    }
    msg.textContent = 'קבל התראה על תדריך יום שישי, הפודקאסט השבועי, סיכום יומי, תנודה חריגה והדוח החודשי.';
    notif.classList.remove('hidden');
  }
  document.getElementById('continueBtn').onclick = function () { ls.set('si_install_seen', '1'); install.classList.add('hidden'); spin.style.display = ''; msg.textContent = 'מתחבר לשרת המאובטח…'; redirect(); };
  document.getElementById('skipBtn').onclick = function () { ls.set('si_notif_dismissed', '1'); notif.classList.add('hidden'); spin.style.display = ''; msg.textContent = 'מתחבר לשרת המאובטח…'; redirect(); };
  document.getElementById('enableBtn').onclick = function () {
    var btn = this; btn.disabled = true; btn.textContent = 'מפעיל…';
    // requestPermission must be the first call inside the tap (iOS requires the user gesture)
    Notification.requestPermission().then(async function (perm) {
      if (perm !== 'granted') throw new Error(perm === 'denied' ? 'ההרשאה נחסמה. אפשר להפעיל אותה בהגדרות ← התראות ← MyInvest.' : 'ההרשאה לא אושרה.');
      var url = await serverUrl();
      var payload = await pushPayload(true, url);
      if (!payload) throw new Error('לא נוצר מנוי להתראות. נסה שוב.');
      ls.set('si_notif_dismissed', '1');
      msg.textContent = 'ההתראות הופעלו ✓ מתחבר לדשבורד לרישום המכשיר…';
      notif.classList.add('hidden'); spin.style.display = '';
      redirect(payload);
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = 'נסה שוב';
      msg.textContent = (e && e.message) || 'ההפעלה נכשלה';
    });
  };

  var wantsSetup = location.hash === '#notifications' || params.has('notifications');
  var wantsInstall = params.has('install');
  var perm = ('Notification' in window) ? Notification.permission : 'unsupported';
  if (wantsInstall && !isStandalone) showInstall();
  else if (wantsSetup) showNotifSetup();
  else if (isStandalone && perm === 'default' && !ls.get('si_notif_dismissed')) showNotifSetup();
  else if (isIOS && !isStandalone && !ls.get('si_install_seen')) showInstall();
  else redirect();
})();
</script>
</body>
</html>
